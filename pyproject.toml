# Project metadata + tool config in one place (roughly the .csproj of a Python project).
[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "chatpdf"
version = "0.1.0"
description = "Chat with your PDF: a free, local Retrieval-Augmented Generation (RAG) app"
readme = "README.md"
requires-python = ">=3.11,<3.13"

[tool.setuptools]
packages = ["app", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: loads the real embedding model (slower, needs model download once)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
