# Runs lint + tests on GitHub's servers on every push and pull request (like an Azure DevOps build pipeline).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allows a manual "Run workflow" button in the Actions tab

# Least privilege by default; the release job asks for write access explicitly.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('app/config.py') }}

      - name: Install dependencies
        # requirements.txt points pip at the CPU-only torch index.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

  # Proves the Dockerfile still builds and the container answers /health (no push yet - that's Azure, 8c).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: chatpdf-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 chatpdf-api:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1

  # CD: only commits that passed lint + tests + docker build reach the `release` branch.
  # Streamlit Community Cloud watches `release` and redeploys automatically when it moves.
  release:
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets the built-in GITHUB_TOKEN push a branch (no personal secret needed)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote main to release
        run: git push origin HEAD:refs/heads/release --force
