# Runs lint + tests on GitHub's servers on every push and pull request (like an Azure DevOps build pipeline).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allows a manual "Run workflow" button in the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('app/config.py') }}

      - name: Install dependencies
        # requirements.txt points pip at the CPU-only torch index.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

  # CD: only commits that passed lint + tests reach the `release` branch.
  # Streamlit Community Cloud watches `release` and redeploys automatically when it moves.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets the built-in GITHUB_TOKEN push a branch (no personal secret needed)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote main to release
        run: git push origin HEAD:refs/heads/release --force
