# Streamlit reads this from the working directory (run from the project root).
# server.address is deliberately not set so hosted platforms (Streamlit Cloud, Docker) can bind.
# To restrict a local run to this machine:  streamlit run streamlit_app.py --server.address localhost
[server]
headless = true
maxUploadSize = 20   # MB; keep in sync with CHATPDF_MAX_UPLOAD_MB (enforced again server-side)

[browser]
gatherUsageStats = false
